version: 2

models:
  - name: int_product_supply_costs
    description: >-
      One row per product SKU. Aggregates component-level supply records into
      the modeled unit supply cost used by the profitability marts.
    columns:
      - name: sku
        description: Product SKU and primary key for this model.
        data_tests:
          - unique
          - not_null
      - name: supply_component_count
        description: Number of supply components assigned to the product.
      - name: unit_supply_cost
        description: Sum of component supply costs for one modeled product unit.
      - name: has_perishable_supply
        description: True when at least one supply component is perishable.
      - name: has_nonperishable_supply
        description: True when at least one supply component is non-perishable.

  - name: int_sales_lines
    description: >-
      One row per sold item. Joins item, order, product, and modeled supply-cost
      data and calculates the unit economics used by the final marts.
    columns:
      - name: item_id
        description: Sold-item identifier and primary key for this model.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Order containing the sold item.
      - name: customer_id
        description: Customer who placed the order.
      - name: store_id
        description: Store that fulfilled the order.
      - name: ordered_at
        description: Timestamp when the order was placed.
      - name: order_date
        description: Calendar date when the order was placed.
      - name: sku
        description: Product SKU sold on the line.
      - name: product_name
        description: Display name of the sold product.
      - name: product_type
        description: Product category, either beverage or jaffle in this dataset.
      - name: units_sold
        description: Fixed value of one because each source item row represents one unit.
      - name: unit_revenue
        description: Product selling price used as revenue for the sold unit.
      - name: unit_supply_cost
        description: Sum of component supply costs assigned to one product unit.
      - name: modeled_gross_profit
        description: Unit revenue minus modeled unit supply cost.
      - name: modeled_gross_margin_pct
        description: Modeled gross profit divided by unit revenue, expressed as a percentage.
